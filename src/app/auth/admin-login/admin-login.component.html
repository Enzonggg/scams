<div class="login-container">
  <!-- Animated Background -->
  <div class="background-animation">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <!-- Date Time Display -->
  <div class="datetime-display">
    <span class="calendar-icon">📅</span>
    {{ currentDateTime }}
  </div>

  <!-- Left Section -->
  <div class="left-section">
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo" class="logo-circle">
    </div>
    <h1 class="system-title">Student Clearance And<br>Monitoring System</h1>
    <p class="version">v1.0</p>
  </div>

  <!-- Right Section -->
  <div class="right-section">
    <div class="login-box">
      <h2 class="login-title">{{ isLoginMode ? 'Admin Login' : 'Admin Registration' }}</h2>
      
      <!-- Login Form -->
      <form *ngIf="isLoginMode" (ngSubmit)="onLogin()">
        <!-- Admin Number Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input 
            type="text" 
            [(ngModel)]="adminNumber" 
            name="adminNumber"
            placeholder="Admin username" 
            class="input-field"
            required
          />
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Password" 
            class="input-field"
            required
          />
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <!-- Login Button -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Log In' }}
        </button>
      </form>

      <!-- Registration Form -->
      <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()">
        <!-- Username Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input 
            type="text" 
            [(ngModel)]="registerUsername" 
            name="registerUsername"
            placeholder="Username" 
            class="input-field"
            required
          />
        </div>

        <!-- Full Name Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input 
            type="text" 
            [(ngModel)]="fullName" 
            name="fullName"
            placeholder="Full Name" 
            class="input-field"
            required
          />
        </div>

        <!-- Password Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="password" 
            [(ngModel)]="registerPassword" 
            name="registerPassword"
            placeholder="Password (min. 8 characters)" 
            class="input-field"
            required
          />
        </div>

        <!-- Confirm Password Input -->
        <div class="input-group">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input 
            type="password" 
            [(ngModel)]="confirmPassword" 
            name="confirmPassword"
            placeholder="Confirm Password" 
            class="input-field"
            required
          />
        </div>

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="success-message">
          {{ successMessage }}
        </div>

        <!-- Register Button -->
        <button type="submit" class="login-btn" [disabled]="isLoading">
          {{ isLoading ? 'Registering...' : 'Register' }}
        </button>
      </form>

      <!-- Toggle Link -->
      <div class="toggle-link">
        <!-- <p *ngIf="isLoginMode">
          Don't have an account? <a (click)="toggleMode()" href="javascript:void(0)">Register here</a>
        </p> -->
        <p *ngIf="!isLoginMode">
          Already have an account? <a (click)="toggleMode()" href="javascript:void(0)">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
