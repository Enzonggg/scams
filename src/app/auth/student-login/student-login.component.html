<div class="login-container">
  <!-- Animated Background -->
  <div class="background-animation">
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
    <div class="square"></div>
  </div>

  <!-- Date Time Display -->
  <div class="datetime-display">
    <span class="calendar-icon">📅</span>
    {{ currentDateTime }}
  </div>

  <!-- Left Section -->
  <div class="left-section">
    <div class="logo-container">
      <img src="logo.jpg" alt="Logo" class="logo-circle">
    </div>
    <h1 class="system-title">Student Clearance And<br>Monitoring System</h1>
    <p class="version">v1.0</p>
  </div>

  <!-- Right Section -->
  <div class="right-section">
    <div class="login-box">
      <!-- Login Form -->
      <div *ngIf="isLoginMode">
        <h2 class="login-title">Student Login</h2>
        
        <form (ngSubmit)="onLogin()">
          <!-- Student Number Input -->
          <div class="input-group">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              [(ngModel)]="studentNumber" 
              name="studentNumber"
              placeholder="Student Number" 
              class="input-field"
              required
            />
          </div>

          <!-- Password Input -->
          <div class="input-group">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              [(ngModel)]="password" 
              name="password"
              placeholder="Password" 
              class="input-field"
              required
            />
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}
          </div>

          <!-- Login Button -->
          <button type="submit" class="login-btn" [disabled]="isLoading">
            {{ isLoading ? 'Logging in...' : 'Login' }}
          </button>
        </form>

        <!-- Footer Links -->
        <!-- <div class="footer-links">
          <a href="#" class="link">Forgot Password?</a>
          <span class="separator">|</span>
          <a routerLink="/admin-login" class="link">Admin Login</a>
        </div> -->

        <!-- Toggle to Register -->
        <div class="toggle-mode">
          <p>Don't have an account? <a (click)="toggleMode()" class="toggle-link">Register here</a></p>
        </div>
      </div>

      <!-- Register Form -->
      <div *ngIf="!isLoginMode">
        <h2 class="login-title">Student Registration</h2>
        
        <form (ngSubmit)="onRegister()">
          <!-- Student Number -->
          <div class="input-group">
            <input 
              type="text" 
              [(ngModel)]="registerStudentNumber" 
              name="registerStudentNumber"
              placeholder="Student Number" 
              class="input-field"
              required
            />
          </div>

          <!-- Last Name -->
          <div class="input-group">
            <input 
              type="text" 
              [(ngModel)]="lastName" 
              name="lastName"
              placeholder="Last Name" 
              class="input-field"
              required
            />
          </div>

          <!-- First Name -->
          <div class="input-group">
            <input 
              type="text" 
              [(ngModel)]="firstName" 
              name="firstName"
              placeholder="First Name" 
              class="input-field"
              required
            />
          </div>

          <!-- Middle Name -->
          <div class="input-group">
            <input 
              type="text" 
              [(ngModel)]="middleName" 
              name="middleName"
              placeholder="Middle Name" 
              class="input-field"
            />
          </div>

          <!-- Program Dropdown -->
          <div class="input-group">
            <select 
              [(ngModel)]="program" 
              name="program"
              class="input-field select-field"
              required>
              <option value="" disabled selected>Select Program</option>
              <option value="BSIT">BSIT</option>
              <option value="BSIS">BSIS</option>
              <option value="BSCS">BSCS</option>
            </select>
          </div>

          <!-- Year Level Dropdown -->
          <div class="input-group">
            <label class="input-label">Year Level</label>
            <select 
              [(ngModel)]="yearLevel" 
              name="yearLevel"
              class="input-field select-field"
              required>
              <option value="" disabled selected>Select Year Level</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>

          <!-- Section Dropdown -->
          <div class="input-group">
            <label class="input-label">Section</label>
            <select 
              [(ngModel)]="section" 
              name="section"
              class="input-field select-field"
              required>
              <option value="" disabled selected>Select Section</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>

          <!-- Major Dropdown (Only for Year 3 & 4) -->
          <div class="input-group" *ngIf="showMajorField">
            <label class="input-label">Major</label>
            <select 
              [(ngModel)]="major" 
              name="major"
              class="input-field select-field"
              [required]="showMajorField">
              <option value="" disabled selected>Select Major</option>
              <option value="WMAD">WMAD</option>
              <option value="AMG">AMG</option>
              <option value="SMP">SMP</option>
              <option value="NETAD">NETAD</option>
              <option value="IS">IS</option>
              <option value="GV">GV</option>
            </select>
          </div>

          <!-- Password -->
          <div class="input-group">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              [(ngModel)]="registerPassword" 
              name="registerPassword"
              placeholder="Password" 
              class="input-field"
              required
            />
          </div>

          <!-- Confirm Password -->
          <div class="input-group">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              [(ngModel)]="confirmPassword" 
              name="confirmPassword"
              placeholder="Confirm Password" 
              class="input-field"
              required
            />
          </div>

          <!-- Error Message -->
          <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
          </div>

          <!-- Success Message -->
          <div *ngIf="successMessage" class="success-message">
            {{ successMessage }}
          </div>

          <!-- Register Button -->
          <button type="submit" class="login-btn" [disabled]="isLoading">
            {{ isLoading ? 'Registering...' : 'Register' }}
          </button>
        </form>

        <!-- Toggle to Login -->
        <div class="toggle-mode">
          <p>Already have an account? <a (click)="toggleMode()" class="toggle-link">Login here</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
